name: 'Rebuild Container'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Use PHP 8.4 base image for older tags
        run: sed -i 's|^FROM php:8-apache$|FROM php:8.4-apache|' Dockerfile

      - name: Login to docker.io container registry
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to ghcr.io container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create container image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=phpgui-${{ matrix.arch }}
          cache-to: type=gha,scope=phpgui-${{ matrix.arch }},mode=max
          outputs: type=image,"name=docker.io/${{ github.repository }},ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          test -n "$DIGEST"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to docker.io container registry
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to ghcr.io container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Check if tag is latest
        id: check_latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          LATEST_TAG=$(gh release view -R "$GH_REPO" --json tagName --jq .tagName)
          if [ "$INPUT_TAG" = "$LATEST_TAG" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create container image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ steps.check_latest.outputs.is_latest }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-platform image
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          shopt -s nullglob
          digests=(/tmp/digests/*)
          test "${#digests[@]}" -eq 2
          for registry in docker.io ghcr.io; do
            image="$registry/${GITHUB_REPOSITORY,,}"
            mapfile -t tags < <(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' <<< "$META_JSON")
            test "${#tags[@]}" -gt 0
            tag_args=()
            digest_args=()
            for tag in "${tags[@]}"; do tag_args+=(-t "$tag"); done
            for digest in "${digests[@]}"; do digest_args+=("$image@sha256:${digest##*/}"); done
            docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          done
