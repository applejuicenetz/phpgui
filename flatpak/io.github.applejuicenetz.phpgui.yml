app-id: io.github.applejuicenetz.phpgui
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
build-options:
  append-path: /usr/lib/sdk/golang/bin
command: phpgui
finish-args:
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*
modules:
  - name: php
    buildsystem: simple
    build-commands:
      - install -Dm755 php /app/bin/php
    sources:
      - type: archive
        only-arches: [aarch64]
        url: https://dl.static-php.dev/static-php-cli/common/php-8.5.8-cli-linux-aarch64.tar.gz
        sha256: af995ef6b3187b39932a00714dfb97e44bfa40a9243c4c29f61f19d583950753
        strip-components: 0
      - type: archive
        only-arches: [x86_64]
        url: https://dl.static-php.dev/static-php-cli/common/php-8.5.8-cli-linux-x86_64.tar.gz
        sha256: 517a18e0f0874de35669fe134eb3c52508e128a6d1da5bf890760cb800ada410
        strip-components: 0
  - name: phpgui-tray
    buildsystem: simple
    build-options:
      env:
        CGO_ENABLED: '0'
        GOFLAGS: -mod=vendor -trimpath
    build-commands:
      - go build -ldflags '-s -w' -o /app/bin/phpgui .
    sources:
      - type: dir
        path: tray
  - name: phpgui
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/phpgui
      - cp -r bootstrap.php src language themes templates public /app/share/phpgui/
      - install -Dm644 io.github.applejuicenetz.phpgui.desktop /app/share/applications/io.github.applejuicenetz.phpgui.desktop
      - install -Dm644 io.github.applejuicenetz.phpgui.metainfo.xml /app/share/metainfo/io.github.applejuicenetz.phpgui.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/128x128/apps/io.github.applejuicenetz.phpgui.png
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.applejuicenetz.phpgui.svg
    sources:
      - type: file
        path: ../bootstrap.php
      - type: dir
        path: ../src
        dest: src
      - type: dir
        path: ../language
        dest: language
      - type: dir
        path: ../themes
        dest: themes
      - type: dir
        path: ../templates
        dest: templates
      - type: dir
        path: ../public
        dest: public
      - type: file
        path: io.github.applejuicenetz.phpgui.desktop
      - type: file
        path: io.github.applejuicenetz.phpgui.metainfo.xml
      - type: file
        path: icon.png
      - type: file
        path: icon.svg
